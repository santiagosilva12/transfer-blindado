[build]
  publish = "dist"
  command = "pip install -r requirements.txt && python build.py"

[[redirects]]
  from = "/sedan"
  to = "/sedan/index.html"
  status = 200

[[redirects]]
  from = "/suv"
  to = "/suv/index.html"
  status = 200

[[redirects]]
  from = "/taxi"
  to = "/taxi-executivo/index.html"
  status = 301

[[redirects]]
  from = "/taxi-executivo"
  to = "/taxi-executivo/index.html"
  status = 200

[[redirects]]
  from = "/van"
  to = "/van/index.html"
  status = 200

[[redirects]]
  from = "/onibus"
  to = "/onibus/index.html"
  status = 200

[[redirects]]
  from = "/frota/:cat"
  to = "/:cat"
  status = 301

[[redirects]]
  from = "/cotacao/:cat"
  to = "/:cat"
  status = 301

[[redirects]]
  from = "/cotacao"
  to = "/sedan"
  status = 301

[[redirects]]
  from = "/reserva"
  to = "/reserva.html"
  status = 200

[[redirects]]
  from = "/frota"
  to = "/#frota"
  status = 301

[[redirects]]
  from = "/servicos"
  to = "/#servicos"
  status = 301

[[redirects]]
  from = "/capitais"
  to = "/#capitais"
  status = 301

[[redirects]]
  from = "/quem-somos"
  to = "/#quem-somos"
  status = 301

[[redirects]]
  from = "/faq"
  to = "/#faq"
  status = 301


