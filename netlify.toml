[build]
  publish = "dist"
  command = "pip install -r requirements.txt && python build.py"

# Novas Rotas com Slugs Otimizados para SEO (200 Rewrite)
[[redirects]]
  from = "/frota/sedan-luxo-blindado"
  to = "/frota/sedan-luxo-blindado/index.html"
  status = 200

[[redirects]]
  from = "/frota/suv-blindada"
  to = "/frota/suv-blindada/index.html"
  status = 200

[[redirects]]
  from = "/frota/taxi-executivo-blindado"
  to = "/frota/taxi-executivo-blindado/index.html"
  status = 200

[[redirects]]
  from = "/frota/van-blindada"
  to = "/frota/van-blindada/index.html"
  status = 200

[[redirects]]
  from = "/frota/onibus-blindado"
  to = "/frota/onibus-blindado/index.html"
  status = 200

