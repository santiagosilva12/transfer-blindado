<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#0a0c0f"/>
    </linearGradient>
    <linearGradient id="goldStrokeBus" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a815a"/>
      <stop offset="50%" stop-color="#e8cca4"/>
      <stop offset="100%" stop-color="#9a815a"/>
    </linearGradient>
    <pattern id="gridBus" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="320" rx="12" fill="url(#bgGradBus)"/>
  <rect width="600" height="320" fill="url(#gridBus)"/>

  <!-- Blueprint Technical Annotations -->
  <g opacity="0.45" font-family="'Courier New', monospace" font-size="10" fill="#c5a880">
    <text x="30" y="35">TB-SPEC // 05-EXECUTIVE-COACH</text>
    <text x="30" y="50">CAPACITY: 26-44 LEITO SUITE TURISMO</text>
    <text x="440" y="35">SCALE: 1:35 ISO</text>
    <text x="440" y="50">CHASSIS: 6x2 TRIPLE AXLE HEAVY</text>
  </g>

  <!-- Technical Axis Lines -->
  <line x1="20" y1="260" x2="580" y2="260" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="20" y1="205" x2="580" y2="205" stroke="rgba(255,255,255,0.07)" stroke-width="0.8"/>
  <line x1="120" y1="50" x2="120" y2="260" stroke="rgba(197,168,128,0.15)" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="480" y1="50" x2="480" y2="260" stroke="rgba(197,168,128,0.15)" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Coach Silhouette Sketch -->
  <g fill="none" stroke="#dcdedf" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="300" cy="256" rx="260" ry="8" fill="rgba(0,0,0,0.6)" stroke="none"/>

    <!-- Main Bus Body -->
    <path d="M 40 225 
             C 55 220, 85 220, 95 220
             C 105 180, 155 180, 165 220
             L 420 220
             C 430 180, 480 180, 490 220
             L 510 220
             C 520 180, 565 180, 572 220
             L 578 220
             C 580 200, 580 80, 575 60
             C 570 55, 555 55, 530 55
             L 100 55
             C 70 55, 45 75, 40 110
             L 35 200
             C 35 215, 36 225, 40 225 Z" 
          stroke="url(#goldStrokeBus)" stroke-width="2.2" opacity="0.95"/>

    <!-- Aerodynamic Windshield & Panoramic Windows -->
    <path d="M 43 110 L 95 65 L 145 65 L 140 135 L 40 135 Z" stroke="#c5a880" stroke-width="1.3" opacity="0.8" fill="rgba(197,168,128,0.06)"/>
    
    <!-- Passenger Panoramic Continuous Glass Ribbon -->
    <path d="M 155 70 L 565 70 L 565 125 L 150 125 Z" stroke="#c5a880" stroke-width="1.3" opacity="0.8" fill="rgba(197,168,128,0.08)"/>
    
    <!-- Window Segment Dividers -->
    <line x1="210" y1="70" x2="210" y2="125" stroke="#718096" stroke-width="1"/>
    <line x1="270" y1="70" x2="270" y2="125" stroke="#718096" stroke-width="1"/>
    <line x1="330" y1="70" x2="330" y2="125" stroke="#718096" stroke-width="1"/>
    <line x1="390" y1="70" x2="390" y2="125" stroke="#718096" stroke-width="1"/>
    <line x1="450" y1="70" x2="450" y2="125" stroke="#718096" stroke-width="1"/>
    <line x1="510" y1="70" x2="510" y2="125" stroke="#718096" stroke-width="1"/>

    <!-- Luggage Bay Compartments (Porões) -->
    <rect x="180" y="160" width="75" height="50" rx="3" stroke="#718096" stroke-width="1" opacity="0.7"/>
    <rect x="265" y="160" width="75" height="50" rx="3" stroke="#718096" stroke-width="1" opacity="0.7"/>
    <rect x="350" y="160" width="60" height="50" rx="3" stroke="#718096" stroke-width="1" opacity="0.7"/>

    <!-- Passenger Door -->
    <rect x="55" y="140" width="35" height="80" rx="2" stroke="#e8cca4" stroke-width="1.2" opacity="0.8"/>

    <!-- Lights -->
    <path d="M 36 195 L 50 192" stroke="#60a5fa" stroke-width="3" opacity="0.9"/>
    <path d="M 578 140 L 578 200" stroke="#ef4444" stroke-width="3" opacity="0.9"/>

    <!-- Wheels (Steer + Dual Drive/Tag) -->
    <!-- Front Steer Wheel -->
    <g transform="translate(130, 220)">
      <circle cx="0" cy="0" r="32" stroke="#475569" stroke-width="3"/>
      <circle cx="0" cy="0" r="27" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="16" stroke="#94a3b8" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="5" fill="#c5a880"/>
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#c5a880" stroke-width="1.2"/>
      <line x1="0" y1="-16" x2="0" y2="16" stroke="#c5a880" stroke-width="1.2"/>
    </g>

    <!-- Rear Tandem 1 -->
    <g transform="translate(455, 220)">
      <circle cx="0" cy="0" r="32" stroke="#475569" stroke-width="3"/>
      <circle cx="0" cy="0" r="27" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="16" stroke="#94a3b8" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="5" fill="#c5a880"/>
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#c5a880" stroke-width="1.2"/>
      <line x1="0" y1="-16" x2="0" y2="16" stroke="#c5a880" stroke-width="1.2"/>
    </g>

    <!-- Rear Tandem 2 -->
    <g transform="translate(540, 220)">
      <circle cx="0" cy="0" r="32" stroke="#475569" stroke-width="3"/>
      <circle cx="0" cy="0" r="27" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="16" stroke="#94a3b8" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="5" fill="#c5a880"/>
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#c5a880" stroke-width="1.2"/>
      <line x1="0" y1="-16" x2="0" y2="16" stroke="#c5a880" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Dimension line -->
  <g stroke="#c5a880" stroke-width="0.8" opacity="0.6">
    <line x1="35" y1="285" x2="578" y2="285"/>
    <line x1="35" y1="280" x2="35" y2="290"/>
    <line x1="578" y1="280" x2="578" y2="290"/>
    <text x="300" y="299" font-family="'Courier New', monospace" font-size="10" fill="#e8cca4" text-anchor="middle" stroke="none">OVERALL LENGTH: 14,000 mm // HEIGHT: 3,850 mm</text>
  </g>
</svg>
