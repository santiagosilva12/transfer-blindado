<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 320" width="100%" height="100%">
  <defs>
    <!-- Metallic Silver/Titanium Gradient for Contours -->
    <linearGradient id="fleetStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#cbd5e1" stop-opacity="0.6" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.25" />
    </linearGradient>

    <!-- Subtle Tint for Armored Glass & Body Paneling -->
    <linearGradient id="bodyGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2433" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0a0c10" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="groundGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.0" />
      <stop offset="35%" stop-color="#cbd5e1" stop-opacity="0.35" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Technical Level Lines (drvn architectural aesthetic) -->
  <g stroke="url(#fleetStroke)" stroke-width="0.75" stroke-dasharray="3,8" opacity="0.35">
    <line x1="20" y1="50" x2="1350" y2="50" />
    <line x1="20" y1="145" x2="1350" y2="145" />
    <line x1="20" y1="270" x2="1350" y2="270" />
  </g>

  <!-- Ground Plane / Speed Reflection Line -->
  <path d="M 30,273 L 1350,273" stroke="url(#groundGlow)" stroke-width="2" />
  <path d="M 100,278 L 1280,278" stroke="url(#groundGlow)" stroke-width="0.8" stroke-dasharray="14,18" opacity="0.6" />

  <!-- =========================================================================
       VEHICLE 1 (Left): Van Executiva VIP (Mercedes Sprinter VIP Blindada)
       Position: x: 30 - 320
       ========================================================================= -->
  <g opacity="0.5" transform="translate(20, 30)">
    <!-- Body Silhouette -->
    <path d="M 50,240 
             L 50,110 
             Q 52,78 78,70 
             L 218,68 
             Q 238,68 244,84 
             L 258,145 
             L 274,168 
             Q 286,182 286,210 
             L 286,240 Z" 
          fill="url(#bodyGlass)" stroke="url(#fleetStroke)" stroke-width="1.3" />

    <!-- Privacy Window Strip -->
    <path d="M 76,86 
             L 210,86 
             L 232,86 
             L 246,140 
             L 95,140 
             Q 76,140 76,115 Z" 
          fill="#111622" stroke="url(#fleetStroke)" stroke-width="0.8" opacity="0.6" />

    <!-- Division Pillars (Armored reinforcement lines) -->
    <line x1="120" y1="86" x2="120" y2="140" stroke="url(#fleetStroke)" stroke-width="1.2" />
    <line x1="162" y1="86" x2="162" y2="140" stroke="url(#fleetStroke)" stroke-width="1.2" />
    <line x1="204" y1="86" x2="204" y2="140" stroke="url(#fleetStroke)" stroke-width="1.2" />

    <!-- Wheels Arch & Wheels -->
    <path d="M 78,240 A 26,26 0 0,1 130,240" stroke="url(#fleetStroke)" stroke-width="1.5" fill="#08090d" />
    <circle cx="104" cy="240" r="20" stroke="url(#fleetStroke)" stroke-width="1.3" fill="#0f131d" />
    <circle cx="104" cy="240" r="8" stroke="url(#fleetStroke)" stroke-width="1.2" fill="#cbd5e1" opacity="0.5" />

    <path d="M 218,240 A 26,26 0 0,1 270,240" stroke="url(#fleetStroke)" stroke-width="1.5" fill="#08090d" />
    <circle cx="244" cy="240" r="20" stroke="url(#fleetStroke)" stroke-width="1.3" fill="#0f131d" />
    <circle cx="244" cy="240" r="8" stroke="url(#fleetStroke)" stroke-width="1.2" fill="#cbd5e1" opacity="0.5" />

    <!-- Technical Tag -->
    <text x="65" y="55" fill="#94a3b8" font-size="8.5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" letter-spacing="1.2">VAN EXECUTIVA VIP • BLINDADA</text>
  </g>

  <!-- =========================================================================
       VEHICLE 2 (Center): Sedan Luxo Blindado (Mercedes-Benz S-Class / BMW 7)
       Position: x: 330 - 810
       ========================================================================= -->
  <g opacity="0.8" transform="translate(320, 45)">
    <!-- Sleek Aerodynamic Sedan Profile -->
    <path d="M 35,225 
             L 52,160 
             Q 62,142 95,142 
             L 150,142 
             Q 192,95 248,88 
             L 325,88 
             Q 360,92 402,132 
             L 458,142 
             Q 485,148 492,176 
             L 495,225 Z" 
          fill="url(#bodyGlass)" stroke="url(#fleetStroke)" stroke-width="1.8" />

    <!-- Executive Armored Greenhouse (Windows & B-Pillar) -->
    <path d="M 160,138 
             Q 200,98 250,94 
             L 320,94 
             Q 352,98 386,138 Z" 
          fill="#141a26" stroke="url(#fleetStroke)" stroke-width="1.2" />
    
    <!-- Armored Thick Pillar Line (Nível III-A Ballistic demarcation) -->
    <line x1="268" y1="94" x2="268" y2="138" stroke="#ffffff" stroke-width="3" stroke-opacity="0.85" />
    <!-- Rear Quarter Window Divider -->
    <line x1="338" y1="96" x2="362" y2="138" stroke="url(#fleetStroke)" stroke-width="1.3" />

    <!-- Character Shoulder Line (Sleek light reflection) -->
    <path d="M 55,155 Q 240,148 485,155" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.75" />
    <path d="M 65,172 Q 240,166 470,172" stroke="url(#fleetStroke)" stroke-width="1" opacity="0.6" />

    <!-- Headlight & Taillight LED Signature -->
    <path d="M 478,158 L 492,160 L 488,172 Z" fill="#ffffff" opacity="0.95" />
    <path d="M 38,164 L 52,164" stroke="#ef4444" stroke-width="2.5" opacity="0.75" />

    <!-- Wheels Arch & Precision Rims -->
    <!-- Rear Wheel -->
    <path d="M 85,225 A 32,32 0 0,1 149,225" stroke="url(#fleetStroke)" stroke-width="2" fill="#08090d" />
    <circle cx="117" cy="225" r="25" stroke="url(#fleetStroke)" stroke-width="1.8" fill="#0d111a" />
    <circle cx="117" cy="225" r="15" stroke="url(#fleetStroke)" stroke-width="1.2" stroke-dasharray="3,3" />
    <circle cx="117" cy="225" r="7" stroke="#ffffff" stroke-width="1.6" fill="#1e2433" />

    <!-- Front Wheel -->
    <path d="M 388,225 A 32,32 0 0,1 452,225" stroke="url(#fleetStroke)" stroke-width="2" fill="#08090d" />
    <circle cx="420" cy="225" r="25" stroke="url(#fleetStroke)" stroke-width="1.8" fill="#0d111a" />
    <circle cx="420" cy="225" r="15" stroke="url(#fleetStroke)" stroke-width="1.2" stroke-dasharray="3,3" />
    <circle cx="420" cy="225" r="7" stroke="#ffffff" stroke-width="1.6" fill="#1e2433" />

    <!-- Technical Specification Callout -->
    <text x="175" y="65" fill="#cbd5e1" font-size="9.5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" letter-spacing="1.5">SEDAN LUXO BLINDADO NÍVEL III-A</text>
    <line x1="335" y1="62" x2="368" y2="62" stroke="url(#fleetStroke)" stroke-width="1" />
    <circle cx="368" cy="62" r="2" fill="#c9a776" />
  </g>

  <!-- =========================================================================
       VEHICLE 3 (Right): SUV Executivo Blindado (Suburban / Escalade Escort)
       Position: x: 810 - 1340
       ========================================================================= -->
  <g opacity="0.95" transform="translate(790, 25)">
    <!-- Robust Armored SUV Stance -->
    <path d="M 35,245 
             L 48,150 
             Q 52,118 78,106 
             L 305,94 
             Q 328,94 348,118 
             L 396,144 
             L 468,150 
             Q 495,156 498,188 
             L 500,245 Z" 
          fill="url(#bodyGlass)" stroke="url(#fleetStroke)" stroke-width="2.2" />

    <!-- High Armored Glasshouse Strip (SUV Tinted Privacy Glass) -->
    <path d="M 82,116 
             L 300,106 
             L 338,124 
             L 382,146 
             L 108,146 
             Q 82,146 82,122 Z" 
          fill="#111622" stroke="url(#fleetStroke)" stroke-width="1.3" />

    <!-- Heavy Ballistic Reinforced Pillars -->
    <line x1="168" y1="112" x2="168" y2="146" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.9" />
    <line x1="244" y1="109" x2="244" y2="146" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.9" />
    <line x1="320" y1="114" x2="320" y2="146" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.9" />

    <!-- Prominent SUV Shoulder Line & Chrome Trim -->
    <path d="M 45,156 Q 260,150 495,156" stroke="#ffffff" stroke-width="2.2" stroke-opacity="0.85" />
    <path d="M 52,174 L 490,174" stroke="url(#fleetStroke)" stroke-width="1.2" opacity="0.6" />

    <!-- Roof Rails Silhouette -->
    <line x1="105" y1="102" x2="295" y2="92" stroke="url(#fleetStroke)" stroke-width="2.2" stroke-opacity="0.8" />

    <!-- Front LED Vertical Blade (Escalade / Suburban Identity) -->
    <path d="M 488,158 L 496,158 L 496,204 L 488,198 Z" fill="#ffffff" opacity="0.95" />
    <line x1="465" y1="180" x2="495" y2="180" stroke="#c9a776" stroke-width="1.8" />

    <!-- Heavy Armored Wheels (22" Onyx Alloy) -->
    <!-- Rear Wheel -->
    <path d="M 98,245 A 36,36 0 0,1 170,245" stroke="url(#fleetStroke)" stroke-width="2.2" fill="#08090d" />
    <circle cx="134" cy="245" r="28" stroke="url(#fleetStroke)" stroke-width="2" fill="#0d111a" />
    <circle cx="134" cy="245" r="17" stroke="url(#fleetStroke)" stroke-width="1.3" stroke-dasharray="4,3" />
    <circle cx="134" cy="245" r="8" stroke="#ffffff" stroke-width="2" fill="#1e2433" />

    <!-- Front Wheel -->
    <path d="M 385,245 A 36,36 0 0,1 457,245" stroke="url(#fleetStroke)" stroke-width="2.2" fill="#08090d" />
    <circle cx="421" cy="245" r="28" stroke="url(#fleetStroke)" stroke-width="2" fill="#0d111a" />
    <circle cx="421" cy="245" r="17" stroke="url(#fleetStroke)" stroke-width="1.3" stroke-dasharray="4,3" />
    <circle cx="421" cy="245" r="8" stroke="#ffffff" stroke-width="2" fill="#1e2433" />

    <!-- Tactical Label -->
    <text x="165" y="78" fill="#ffffff" font-size="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" letter-spacing="1.6">SUV EXECUTIVO BLINDADO NÍVEL III-A</text>
    <line x1="340" y1="74" x2="380" y2="74" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="380" cy="74" r="2.5" fill="#c9a776" />
  </g>

  <!-- Technical Fleet Demarcation (drvn aesthetic watermark) -->
  <g opacity="0.45" transform="translate(60, 302)">
    <text x="0" y="0" fill="#94a3b8" font-size="8.5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" letter-spacing="2.2">
      FROTA EXECUTIVA HOMOLOGADA • OPERAÇÃO TÁTICA DISCRETA 24/7 • BLINDAGEM NÍVEL III-A CERTIFICADA PELO EXÉRCITO
    </text>
  </g>
</svg>
