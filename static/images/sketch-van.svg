<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradVan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#0a0c0f"/>
    </linearGradient>
    <linearGradient id="goldStrokeVan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a815a"/>
      <stop offset="50%" stop-color="#e8cca4"/>
      <stop offset="100%" stop-color="#9a815a"/>
    </linearGradient>
    <pattern id="gridVan" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="320" rx="12" fill="url(#bgGradVan)"/>
  <rect width="600" height="320" fill="url(#gridVan)"/>

  <!-- Blueprint Technical Annotations -->
  <g opacity="0.45" font-family="'Courier New', monospace" font-size="10" fill="#c5a880">
    <text x="30" y="35">TB-SPEC // 04-EXECUTIVE-VAN</text>
    <text x="30" y="50">CAPACITY: 10-16 SEATS VIP HIGH-ROOF</text>
    <text x="440" y="35">SCALE: 1:25 ISO</text>
    <text x="440" y="50">CABIN: STANDING HEIGHT 1,940 mm</text>
  </g>

  <!-- Technical Axis Lines -->
  <line x1="30" y1="260" x2="570" y2="260" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="30" y1="205" x2="570" y2="205" stroke="rgba(255,255,255,0.07)" stroke-width="0.8"/>
  <line x1="160" y1="50" x2="160" y2="260" stroke="rgba(197,168,128,0.15)" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="470" y1="50" x2="470" y2="260" stroke="rgba(197,168,128,0.15)" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Van Silhouette Sketch -->
  <g fill="none" stroke="#dcdedf" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="315" cy="256" rx="245" ry="8" fill="rgba(0,0,0,0.6)" stroke="none"/>

    <!-- Outer Van Hull -->
    <path d="M 50 225 
             C 70 220, 110 220, 120 220
             C 135 180, 185 180, 200 220
             L 430 220
             C 445 180, 495 180, 510 220
             L 555 220
             C 565 220, 570 210, 568 190
             L 560 75
             C 558 68, 550 65, 540 65
             L 210 65
             C 165 65, 125 95, 105 140
             L 50 200
             C 45 208, 45 220, 50 225 Z" 
          stroke="url(#goldStrokeVan)" stroke-width="2.2" opacity="0.95"/>

    <!-- Windows (Executive Fleet Glass) -->
    <path d="M 112 140 L 200 75 L 210 145 L 125 145 Z" stroke="#c5a880" stroke-width="1.3" opacity="0.8" fill="rgba(197,168,128,0.06)"/>
    <path d="M 220 75 L 320 75 L 320 145 L 220 145 Z" stroke="#c5a880" stroke-width="1.3" opacity="0.8" fill="rgba(197,168,128,0.06)"/>
    <path d="M 330 75 L 430 75 L 430 145 L 330 145 Z" stroke="#c5a880" stroke-width="1.3" opacity="0.8" fill="rgba(197,168,128,0.06)"/>
    <path d="M 440 75 L 545 75 L 548 145 L 440 145 Z" stroke="#c5a880" stroke-width="1.3" opacity="0.8" fill="rgba(197,168,128,0.06)"/>

    <!-- Door Divisors -->
    <line x1="215" y1="65" x2="215" y2="220" stroke="#718096" stroke-width="1.2" opacity="0.8"/>
    <line x1="330" y1="150" x2="330" y2="220" stroke="#718096" stroke-width="1.4" opacity="0.9"/>
    <line x1="440" y1="150" x2="440" y2="220" stroke="#718096" stroke-width="1.2" opacity="0.8"/>

    <!-- Running Board Step -->
    <rect x="225" y="215" width="200" height="4" rx="2" fill="#e8cca4" opacity="0.8"/>

    <!-- Front & Rear Lights -->
    <path d="M 50 195 L 75 190" stroke="#60a5fa" stroke-width="3" opacity="0.9"/>
    <path d="M 565 140 L 565 210" stroke="#ef4444" stroke-width="3" opacity="0.9"/>

    <!-- Wheels -->
    <g transform="translate(160, 220)">
      <circle cx="0" cy="0" r="36" stroke="#475569" stroke-width="3"/>
      <circle cx="0" cy="0" r="31" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="18" stroke="#94a3b8" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="6" fill="#c5a880"/>
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#c5a880" stroke-width="1.3"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#c5a880" stroke-width="1.3"/>
      <line x1="-13" y1="-13" x2="13" y2="13" stroke="#c5a880" stroke-width="1.3"/>
      <line x1="-13" y1="13" x2="13" y2="-13" stroke="#c5a880" stroke-width="1.3"/>
    </g>

    <g transform="translate(470, 220)">
      <circle cx="0" cy="0" r="36" stroke="#475569" stroke-width="3"/>
      <circle cx="0" cy="0" r="31" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="18" stroke="#94a3b8" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="6" fill="#c5a880"/>
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#c5a880" stroke-width="1.3"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#c5a880" stroke-width="1.3"/>
      <line x1="-13" y1="-13" x2="13" y2="13" stroke="#c5a880" stroke-width="1.3"/>
      <line x1="-13" y1="13" x2="13" y2="-13" stroke="#c5a880" stroke-width="1.3"/>
    </g>
  </g>

  <!-- Dimension line -->
  <g stroke="#c5a880" stroke-width="0.8" opacity="0.6">
    <line x1="45" y1="285" x2="565" y2="285"/>
    <line x1="45" y1="280" x2="45" y2="290"/>
    <line x1="565" y1="280" x2="565" y2="290"/>
    <text x="305" y="299" font-family="'Courier New', monospace" font-size="10" fill="#e8cca4" text-anchor="middle" stroke="none">OVERALL LENGTH: 7,360 mm // WHEELBASE: 4,325 mm</text>
  </g>
</svg>
