<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 66" width="100%" height="100%">
  <!-- Top Red Stripe -->
  <rect width="100" height="16.5" fill="#AA151B"/>
  <!-- Middle Yellow Stripe -->
  <rect y="16.5" width="100" height="33" fill="#F1BF00"/>
  <!-- Bottom Red Stripe -->
  <rect y="49.5" width="100" height="16.5" fill="#AA151B"/>
  <!-- Spanish Coat of Arms Emblem (Left-Center) -->
  <g transform="translate(26, 33) scale(0.65)">
    <!-- Crown -->
    <path d="M -9,-14 L -11,-10 L 0,-12 L 11,-10 L 9,-14 Z" fill="#AA151B"/>
    <circle cx="0" cy="-15" r="1.5" fill="#F1BF00"/>
    <circle cx="-9" cy="-14" r="1.2" fill="#F1BF00"/>
    <circle cx="9" cy="-14" r="1.2" fill="#F1BF00"/>
    <!-- Shield -->
    <path d="M -8,-9 L 8,-9 L 8,3 C 8,9 0,13 0,13 C 0,13 -8,9 -8,3 Z" fill="#AA151B" stroke="#0f172a" stroke-width="0.8"/>
    <rect x="-6" y="-7" width="12" height="9" fill="#F1BF00"/>
    <line x1="0" y1="-7" x2="0" y2="8" stroke="#AA151B" stroke-width="0.8"/>
    <line x1="-6" y1="-1" x2="6" y2="-1" stroke="#AA151B" stroke-width="0.8"/>
    <!-- Pillars of Hercules (Left and Right) -->
    <rect x="-14" y="-8" width="2" height="16" fill="#CBD5E1"/>
    <rect x="12" y="-8" width="2" height="16" fill="#CBD5E1"/>
    <path d="M -15,-9 L -11,-9 L -13,-12 Z" fill="#AA151B"/>
    <path d="M 11,-9 L 15,-9 L 13,-12 Z" fill="#AA151B"/>
  </g>
</svg>
